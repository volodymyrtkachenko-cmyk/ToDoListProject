<div class="modal fade" id="archiveViewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <!-- Додано легку тінь та рамку самому вікну для об'єму -->
        <div class="modal-content flo-modal"
             style="box-shadow: 0 20px 40px -10px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.08);">

            <div class="flo-modal-header">
                <h5 class="flo-modal-title" style="color: #ffffff; font-weight: 600;">Деталі завдання</h5>
                <button type="button" class="flo-close-btn" data-bs-dismiss="modal" aria-label="Закрити">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 1l12 12M13 1L1 13"/>
                    </svg>
                </button>
            </div>

            <div class="modal-body p-4 pt-3">

                <!-- Блок категорії та пріоритету -->
                <span class="flo-label"
                          style="display: block; margin-bottom: 8px; font-size: 0.8rem; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">Категорія</span>
                <div class="flo-preview d-flex justify-content-between align-items-center mb-4"
                     style="background: rgba(255,255,255,0.02); padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.04);">

                    <div class="d-flex align-items-center gap-3">
                        <!-- Додано box-shadow для ефекту світіння -->
                        <span id="view-preview-dot"
                              style="width: 12px; height: 12px; border-radius: 50%; display: inline-block; "></span>
                        <span id="view-task-cat"
                              style="font-weight: 600; color: #ffffff; font-size: 1.05rem; letter-spacing: 0.3px;"></span>
                    </div>
                    <!-- Додано колір тексту для більшого контрасту з фоном -->
                    <span id="view-task-pri"
                          style="background: rgba(239,68,68,0.15); color: #ef4444; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid rgba(239,68,68,0.2);"></span>
                </div>

                <!-- Назва -->
                <div class="mb-4">
                    <span class="flo-label"
                          style="display: block; margin-bottom: 8px; font-size: 0.8rem; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">Назва</span>
                    <div class="flo-input" id="view-task-title"
                         style="min-height: unset; cursor: default; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 14px 16px; color: #f4f4f5; font-size: 1.05rem; font-weight: 500;"></div>
                </div>

                <!-- Опис -->
                <div class="mb-4">
                    <span class="flo-label"
                          style="display: block; margin-bottom: 8px; font-size: 0.8rem; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">Опис</span>
                    <div class="flo-input" id="view-task-desc"
                         style="min-height: 90px; cursor: default; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 14px 16px; color: #d4d4d8; white-space: pre-wrap; line-height: 1.5;"></div>
                </div>

                <!-- Дата виконання -->
                <div class="mb-2">
                    <span class="flo-label"
                          style="display: block; margin-bottom: 8px; font-size: 0.8rem; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;">Виконано</span>
                    <div class="flo-input" id="view-task-date"
                         style="min-height: unset; cursor: default; background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.1); border-radius: 8px; padding: 12px 16px; color: #34d399; font-weight: 500; display: inline-block;"></div>
                </div>

                <div class="flo-actions" style="justify-content: flex-end; margin-top: 32px;">
                    <!-- Кнопка закриття також може отримати трохи ховер-ефекту через твій CSS -->
                    <button type="button" class="flo-btn-cancel" data-bs-dismiss="modal">Закрити</button>
                </div>

            </div>
        </div>
    </div>
</div>
